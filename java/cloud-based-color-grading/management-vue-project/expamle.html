<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>苹果风格图库滚轮</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #111;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* 左侧滚轮区域 25% */
    .carousel-wrap {
      width: 25%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .wheel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      scroll-behavior: smooth;
    }

    /* 苹果风格滚轮项 */
    .wheel-item {
      width: 160px;
      height: 90px;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s ease;
      opacity: 0.6;
      border: 2px solid transparent;
    }

    .wheel-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 选中放大 + 高亮 */
    .wheel-item.active {
      height: 120px;
      opacity: 1;
      transform: scale(1.08);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    /* 收藏红色边框 */
    .wheel-item.fav {
      border-color: #ff3b30;
    }

    /* 右侧预览 75% */
    .preview-wrap {
      width: 75%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .preview-img {
      max-width: 90%;
      max-height: 80vh;
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
    }

    .toolbar {
      margin-top: 24px;
      display: flex;
      gap: 12px;
    }

    button {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-fav {
      background: #ff3b30;
      color: #fff;
    }

    .btn-del {
      background: #333;
      color: #fff;
    }
  </style>
</head>

<body>
  <!-- 左侧苹果滚轮 -->
  <div class="carousel-wrap">
    <div class="wheel" id="wheel">
      <div class="wheel-item active" data-id="1" data-fav="false">
        <img src="https://picsum.photos/800/450?random=1">
      </div>
      <div class="wheel-item" data-id="2" data-fav="true">
        <img src="https://picsum.photos/800/450?random=2">
      </div>
      <div class="wheel-item" data-id="3" data-fav="false">
        <img src="https://picsum.photos/800/450?random=3">
      </div>
      <div class="wheel-item" data-id="4" data-fav="false">
        <img src="https://picsum.photos/800/450?random=4">
      </div>
      <div class="wheel-item" data-id="5" data-fav="false">
        <img src="https://picsum.photos/800/450?random=5">
      </div>
    </div>
  </div>

  <!-- 右侧预览区 -->
  <div class="preview-wrap">
    <img src="" id="previewImg" class="preview-img">
    <div class="toolbar">
      <button class="btn-fav" id="toggleFav">收藏</button>
      <button class="btn-del" id="deleteImg">删除</button>
    </div>
  </div>

  <script>
    const items = document.querySelectorAll('.wheel-item');
    const previewImg = document.getElementById('previewImg');
    const toggleFav = document.getElementById('toggleFav');
    const deleteImg = document.getElementById('deleteImg');
    let currentItem = items[0];

    // 初始化显示第一张
    previewImg.src = currentItem.querySelector('img').src;
    updateFavBtn();

    // 点击切换
    items.forEach(item => {
      item.addEventListener('click', () => {
        currentItem.classList.remove('active');
        item.classList.add('active');
        currentItem = item;
        previewImg.src = item.querySelector('img').src;
        updateFavBtn();
      });
    });

    // 收藏切换
    function updateFavBtn() {
      const isFav = currentItem.dataset.fav === 'true';
      toggleFav.textContent = isFav ? '取消收藏' : '收藏';
      currentItem.classList.toggle('fav', isFav);
    }

    toggleFav.addEventListener('click', () => {
      const isFav = currentItem.dataset.fav === 'true';
      currentItem.dataset.fav = !isFav;
      updateFavBtn();
    });

    // 删除
    deleteImg.addEventListener('click', () => {
      if (items.length <= 1) return alert('至少保留一张');
      currentItem.remove();
      const newItems = document.querySelectorAll('.wheel-item');
      if (newItems.length) {
        newItems[0].click();
      }
    });
  </script>
</body>
</html>
