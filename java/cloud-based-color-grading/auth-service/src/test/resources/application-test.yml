spring:
  application:
    name: auth-service-test
  cloud:
    nacos:
      discovery:
        enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # TestContainers will override these values
    url: jdbc:mysql://localhost:3306/test
    username: test
    password: test
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
  data:
    redis:
      # TestContainers will override these values
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      password: ""
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

server:
  port: 0  # Random port for testing

# JWT Configuration
jwt:
  secret: test-secret-key-for-jwt-token-generation-must-be-at-least-256-bits-long-for-security
  expiration: 7200000  # 2 hours
  refresh-threshold: 1800000  # 30 minutes

# Security Configuration
security:
  login:
    max-failures: 5
    lock-duration: 900  # 15 minutes
  password:
    encoder: bcrypt

# MyBatis-Plus Configuration
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

# Logging
logging:
  level:
    cn.gsjgsj: DEBUG
    org.testcontainers: INFO
