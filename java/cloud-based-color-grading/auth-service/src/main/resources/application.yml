spring:
  application:
    name: auth-service
  cloud:
    nacos:
      discovery:
        enabled: false
        server-addr: 139.199.17.216:8848
        username: nacos
        password: nacos
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://139.199.17.216:13306/cloud_color_grading?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:139.199.17.216}
      port: ${REDIS_PORT:16739}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3000ms}
      password: ${REDIS_PASSWORD:123456}
      lettuce:
        pool:
          max-active: 8  # Maximum number of connections in the pool
          max-idle: 8    # Maximum number of idle connections in the pool
          min-idle: 0    # Minimum number of idle connections in the pool
          max-wait: -1ms # Maximum wait time for connection

server:
  port: 8081

# Authz Service Configuration
authz-service:
  url: ${AUTHZ_SERVICE_URL:http://localhost:8082}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:YourSecretKeyForJWTTokenGenerationShouldBeAtLeast256BitsLongAndSecure123456789}
  expiration: ${JWT_EXPIRATION:7200000}  # 2 hours in milliseconds (default)
  refresh-threshold: ${JWT_REFRESH_THRESHOLD:1800000}  # 30 minutes in milliseconds

# Security Configuration
security:
  login:
    max-failures: ${LOGIN_MAX_FAILURES:5}  # Maximum login failures before account lock
    lock-duration: ${LOGIN_LOCK_DURATION:900}  # Account lock duration in seconds (15 minutes)
  password:
    encoder: bcrypt  # Password encoding algorithm

# MyBatis-Plus Configuration
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
